name: Release-plz

# grain-id makes the `v{version}` tag and GitHub release (release-plz.toml);
# grain-id-cli shares its version group, so its binaries go onto that release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    secrets: inherit

  build-cli:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'grain-id')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['grain-id'] }}
