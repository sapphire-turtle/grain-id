[package]
name = "grain-id-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
grain-id = { path = "../crates/grain-id", features = ["arbitrary", "serde"] }
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
